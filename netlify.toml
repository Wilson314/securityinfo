[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# 將 /api/* 請求轉發到 Render 後端
# 部署後請將 YOUR_RENDER_BACKEND_URL 換成你的 Render 後端網址
# 例如: https://securityinfo-backend.onrender.com
[[redirects]]
  from   = "/api/*"
  to     = "https://securityinfo-backend.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback（讓 React Router 正常運作）
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
